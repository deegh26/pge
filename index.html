<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Utility Visualizer Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab { padding: 10px 20px; cursor: pointer; border-radius: 8px 8px 0 0; background: #eee; font-weight: bold; }
        .tab.active { background: white; border: 1px solid #ddd; border-bottom: 2px solid white; margin-bottom: -2px; color: #007bff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 25px; padding: 20px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; }
        label { font-size: 0.8rem; font-weight: bold; color: #555; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
        button { background-color: #007bff; color: white; cursor: pointer; border: none; font-weight: bold; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .chart-card { background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 8px; min-height: 350px; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .controls select { width: auto; padding: 5px; font-size: 0.8rem; border: 2px solid #007bff; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; font-size: 0.9rem; }
        th { background: #f4f4f4; }
        .status-banner { background: #e8f5e9; padding: 12px; border-left: 5px solid #4caf50; margin-bottom: 15px; border-radius: 4px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>Utility Bill Visualizer (Cloud Connected)</h2>
    
    <div class="status-banner" id="statusField">Loading dashboard metrics...</div>

    <div class="form-group">
        <div><label>Month/Year</label><input type="month" id="month"></div>
        <div><label>kWh Used</label><input type="number" id="kwh" placeholder="0"></div>
        <div><label>Elec. Bill ($)</label><input type="number" step="0.01" id="elecBill" placeholder="0.00"></div>
        <div><label>Total Bill ($)</label><input type="number" step="0.01" id="totalBill" placeholder="0.00"></div>
        <div style="align-self: end;"><button onclick="sendToCloud()" id="saveBtn">Save to Cloud</button></div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab(event, 'dashboard')">Dashboard</div>
        <div class="tab" onclick="switchTab(event, 'history')">Historical Data</div>
    </div>

    <div id="dashboard" class="tab-content active">
        <div class="charts-grid">
            <div class="chart-card">
                <h3>Overall Spending Trend ($)</h3>
                <canvas id="momChart"></canvas>
            </div>
            <div class="chart-card">
                <div class="controls">
                    <h3>Year-over-Year</h3>
                    <select id="yoyMetric" onchange="updateUI()">
                        <option value="total">Total Bill ($)</option>
                        <option value="elec">Electricity ($)</option>
                        <option value="gas">Gas ($)</option>
                        <option value="kwh">kWh Usage</option>
                    </select>
                </div>
                <canvas id="yoyChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Elec vs Gas Split</h3>
                <canvas id="splitChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>YoY Comparison %</h3>
                <canvas id="savingsChart"></canvas>
            </div>
        </div>
    </div>

    <div id="history" class="tab-content">
        <div class="table-container">
            <h3>Entry Logs (Read-Only Cloud Copy)</h3>
            <table>
                <thead><tr><th>Month</th><th>kWh</th><th>Elec $</th><th>Gas $</th><th>Total $</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // PASTE YOUR GOOGLE WEB APP URL HERE
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzdeN4OvO71HcryGc8JYzMpkGcWepqgIHENpZdbxOrEih2iHCgk9Au7LqBkkBe4kAUX/exec';

    let utilityData = [];
    let charts = {};
    const colorPalette = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#424242'];

    function switchTab(e, tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        e.currentTarget.classList.add('active');
    }

    async function fetchFromCloud() {
        try {
            const response = await fetch(WEB_APP_URL);
            utilityData = await response.json();
            document.getElementById('statusField').innerText = "Dashboard synced successfully with Google Sheets.";
            updateUI();
        } catch (err) {
            document.getElementById('statusField').innerText = "Error syncing with cloud storage.";
        }
    }

    async function sendToCloud() {
        const month = document.getElementById('month').value;
        if(!month) return alert("Please select a Month/Year.");

        const total = parseFloat(document.getElementById('totalBill').value) || 0;
        const elec = parseFloat(document.getElementById('elecBill').value) || 0;
        const kwh = parseFloat(document.getElementById('kwh').value) || 0;
        const gas = Number((total - elec).toFixed(2));

        const payload = { month, kwh, elec, gas, total };
        
        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        saveBtn.innerText = "Saving...";
        document.getElementById('statusField').innerText = "Sending data to Google Sheets...";

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            ['month','totalBill','elecBill','kwh'].forEach(id => document.getElementById(id).value = '');
            
            saveBtn.innerText = "Saved!";
            document.getElementById('statusField').innerText = "Row added! Updating dashboard in 3 seconds...";
            
            setTimeout(() => {
                window.location.reload();
            }, 3000);

        } catch(err) {
            alert("Failed to write to Google Sheets.");
            saveBtn.disabled = false;
            saveBtn.innerText = "Save to Cloud";
        }
    }

    function parseToCleanMonth(rawInput) {
        let inputStr = String(rawInput).trim();
        if (/^\d{4}-\d{2}$/.test(inputStr)) return inputStr;
        
        const monthMap = {
            'Jan': '01', 'Feb': '02', 'Mar': '03', 'Apr': '04', 'May': '05', 'Jun': '06',
            'Jul': '07', 'Aug': '08', 'Sep': '09', 'Oct': '10', 'Nov': '11', 'Dec': '12'
        };

        for (let key in monthMap) {
            if (inputStr.includes(key)) {
                let yearMatch = inputStr.match(/\d{4}/);
                let year = yearMatch ? yearMatch[0] : new Date().getFullYear();
                return `${year}-${monthMap[key]}`;
            }
        }
        
        let parsedDate = new Date(inputStr);
        if (!isNaN(parsedDate.getTime())) {
            let y = parsedDate.getFullYear();
            let m = ("0" + (parsedDate.getMonth() + 1)).slice(-2);
            return `${y}-${m}`;
        }
        
        return inputStr.substring(0, 7);
    }

    function updateUI() {
        if(utilityData.length === 0) return;

        const sanitizedData = utilityData.map(d => ({
            ...d,
            cleanMonth: parseToCleanMonth(d.month)
        })).sort((a, b) => {
            const [yearA, monthA] = a.cleanMonth.split('-').map(Number);
            const [yearB, monthB] = b.cleanMonth.split('-').map(Number);
            return yearA !== yearB ? yearA - yearB : monthA - monthB;
        });

        const labels = sanitizedData.map(d => d.cleanMonth);
        const metric = document.getElementById('yoyMetric').value;

        if (charts.mom) charts.mom.destroy();
        if (charts.yoy) charts.yoy.destroy();
        if (charts.split) charts.split.destroy();
        if (charts.savings) charts.savings.destroy();

        // FORCES VISUAL LABELS TO REMAIN PRINTED ON CRITICAL GRID TIMELINES
        const configOptions = {
            responsive: true,
            scales: { 
                x: { 
                    type: 'category',
                    ticks: {
                        autoSkip: false,
                        maxRotation: 45,
                        minRotation: 45
                    }
                } 
            }
        };

        charts.mom = new Chart(document.getElementById('momChart'), { 
            type: 'line', 
            data: { labels: labels, datasets: [{ label: 'Total $', borderColor: '#2ecc71', data: sanitizedData.map(d => d.total), fill: true, backgroundColor: 'rgba(46, 204, 113, 0.1)' }] },
            options: configOptions
        });

        charts.split = new Chart(document.getElementById('splitChart'), { 
            type: 'bar', 
            data: { labels: labels, datasets: [{ label: 'Elec $', backgroundColor: '#f1c40f', data: sanitizedData.map(d => d.elec) }, { label: 'Gas $', backgroundColor: '#e67e22', data: sanitizedData.map(d => d.gas) }]}, 
            options: { 
                scales: { 
                    x: { 
                        stacked: true, 
                        type: 'category',
                        ticks: {
                            autoSkip: false,
                            maxRotation: 45,
                            minRotation: 45
                        }
                    }, 
                    y: { stacked: true } 
                } 
            } 
        });

        const years = [...new Set(sanitizedData.map(d => d.cleanMonth.split('-')[0]))].sort();
        const pctChanges = [];
        const pctLabels = [];

        const yoyDatasets = years.map((year, i) => {
            const yearArr = new Array(12).fill(null);
            sanitizedData.filter(d => d.cleanMonth.startsWith(year)).forEach(d => {
                const mIdx = parseInt(d.cleanMonth.split('-')[1]) - 1;
                yearArr[mIdx] = Number(d[metric]);

                const prevYearMonth = `${parseInt(year)-1}-${d.cleanMonth.split('-')[1]}`;
                const prev = sanitizedData.find(pd => pd.cleanMonth === prevYearMonth);
                
                if(prev) {
                    const prevVal = Number(prev[metric]);
                    const currVal = Number(d[metric]);
                    if (prevVal > 0) {
                        const diff = (((currVal - prevVal) / prevVal) * 100).toFixed(1);
                        pctChanges.push(diff);
                        pctLabels.push(d.cleanMonth);
                    } else if (prevVal === 0 && currVal > 0) {
                        pctChanges.push(100.0);
                        pctLabels.push(d.cleanMonth);
                    }
                }
            });
            return { 
                label: year, 
                data: yearArr, 
                borderColor: colorPalette[i % colorPalette.length], 
                backgroundColor: colorPalette[i % colorPalette.length],
                fill: false,
                borderWidth: 3
            };
        });

        charts.yoy = new Chart(document.getElementById('yoyChart'), { 
            type: 'line', 
            data: { labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], datasets: yoyDatasets }, 
            options: { tension: 0.3 } 
        });
        
        charts.savings = new Chart(document.getElementById('savingsChart'), { 
            type: 'bar', 
            data: { 
                labels: pctLabels, 
                datasets: [{ 
                    label: `% Change in ${metric.toUpperCase()}`, 
                    data: pctChanges,
                    backgroundColor: pctChanges.map(v => v < 0 ? '#27ae60' : '#e74c3c')
                }] 
            },
            options: configOptions
        });

        document.getElementById('tableBody').innerHTML = sanitizedData.map((d) => `
            <tr>
                <td>${d.cleanMonth}</td><td>${d.kwh}</td><td>$${d.elec}</td><td>$${d.gas}</td><td>$${d.total}</td>
            </tr>
        `).reverse().join('');
    }

    window.onload = fetchFromCloud;
</script>
</body>
</html>
